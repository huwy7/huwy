# Sveltia CMS — Konfiguration gegen die Collection aus Spezifikation 7.
# OAuth-Vermittler: Cloudflare-Worker sveltia-cms-auth (Build-Plan Phase 6).
# Siehe docs/cms.md.

backend:
  name: github
  repo: huwy7/huwy
  branch: main
  # OAuth-Vermittler (Cloudflare-Worker sveltia-cms-auth).
  base_url: https://sveltia-cms-auth.nico-huwy.workers.dev

# Fallback-Medienordner; die eigentliche Ablage regelt die Collection pro Serie.
media_folder: src/assets/serien
public_folder: /src/assets/serien

collections:
  - name: serien
    label: Serien
    label_singular: Serie
    folder: src/content/serien
    create: true
    slug: '{{slug}}'
    # Bilder pro Serie relativ zur Markdown-Datei — passt zu astro:assets, das die
    # Bildpfade relativ zur Content-Datei auflöst (Spezifikation 8).
    media_folder: '../../assets/serien/{{slug}}'
    public_folder: '../../assets/serien/{{slug}}'
    # Titelbild = zugleich erstes Bild der Serie. „Weitere Bilder" ist eine
    # einfache Upload-Liste ohne zusätzliche Textfelder.
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: jahr, label: Jahr, widget: number, value_type: int }
      - { name: reihenfolge, label: Reihenfolge, widget: number, value_type: int }
      - { name: titelbild, label: Titelbild (= erstes Bild), widget: image }
      - name: bilder
        label: Weitere Bilder
        label_singular: Bild
        widget: list
        required: false
        field: { name: bild, label: Bild, widget: image }
      - { name: body, label: Text, widget: markdown, required: false }
