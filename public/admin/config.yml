# Sveltia CMS — flaches Bild-Modell.
# Serien tragen nur Metadaten (Titel/Jahr/Reihenfolge). Bilder sind eigene Einträge
# mit Serie (Auswahl) + Reihenfolge — zentral hochladen und einer Serie zuweisen,
# ohne verschachtelte Listen. Siehe docs/cms.md.

backend:
  name: github
  repo: huwy7/huwy
  branch: main
  # OAuth-Vermittler (Cloudflare-Worker sveltia-cms-auth).
  base_url: https://sveltia-cms-auth.nico-huwy.workers.dev

# Fallback-Medienordner; die eigentliche Ablage regelt die Collection.
media_folder: src/assets
public_folder: /src/assets

collections:
  # --- Schwarzweiss (düster) ---
  # Serie: nur Metadaten (keine Bilder — die kommen aus „Bilder (Schwarzweiss)").
  - name: serien
    label: Serien (Schwarzweiss)
    label_singular: Serie
    folder: src/content/serien
    create: true
    slug: '{{slug}}'
    identifier_field: titel
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: jahr, label: Jahr, widget: number, value_type: int }
      - {
          name: reihenfolge,
          label: Reihenfolge (1 = zuoberst),
          widget: number,
          value_type: int,
        }

  # Bild: ein Foto, einer Serie zugeordnet, mit Position. Zentraler Upload-Bereich.
  - name: serienbilder
    label: Bilder (Schwarzweiss)
    label_singular: Bild
    folder: src/content/serienbilder
    create: true
    slug: '{{serie}}-{{reihenfolge}}'
    summary: '{{fields.serie}} · {{fields.reihenfolge}}'
    thumbnail: bild
    media_folder: '../../assets/serienbilder'
    public_folder: '../../assets/serienbilder'
    fields:
      - { name: bild, label: Bild, widget: image }
      - name: serie
        label: Serie
        widget: relation
        collection: serien
        value_field: '{{slug}}'
        search_fields: [titel]
        display_fields: [titel]
      - {
          name: reihenfolge,
          label: Reihenfolge in der Serie (1 = Titelbild),
          widget: number,
          value_type: int,
        }

  # --- Farbe ---
  - name: farbserien
    label: Serien (Farbe)
    label_singular: Farbserie
    folder: src/content/farbserien
    create: true
    slug: '{{slug}}'
    identifier_field: titel
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: jahr, label: Jahr, widget: number, value_type: int }
      - {
          name: reihenfolge,
          label: Reihenfolge (1 = zuoberst),
          widget: number,
          value_type: int,
        }

  - name: farbbilder
    label: Bilder (Farbe)
    label_singular: Bild
    folder: src/content/farbbilder
    create: true
    slug: '{{serie}}-{{reihenfolge}}'
    summary: '{{fields.serie}} · {{fields.reihenfolge}}'
    thumbnail: bild
    media_folder: '../../assets/farbbilder'
    public_folder: '../../assets/farbbilder'
    fields:
      - { name: bild, label: Bild, widget: image }
      - name: serie
        label: Serie
        widget: relation
        collection: farbserien
        value_field: '{{slug}}'
        search_fields: [titel]
        display_fields: [titel]
      - {
          name: reihenfolge,
          label: Reihenfolge in der Serie (1 = Titelbild),
          widget: number,
          value_type: int,
        }

  # --- About-Seiten (Text + flexible Bilder-Liste) ---
  # Zwei feste Seiten. Text = Markdown, Bilder = Liste (abwechselnd rechts/links).
  # Platzhalter-Bilder einfach ersetzen; Reihenfolge per Drag. Spotify ist ein
  # Code-Platzhalter (nur düster) und nicht im CMS.
  - name: seiten
    label: About-Seiten
    files:
      - name: ueber-mich
        label: About me (düster)
        file: src/content/seiten/ueber-mich.md
        media_folder: '../../assets/seiten'
        public_folder: '../../assets/seiten'
        fields:
          - name: bilder
            label: Bilder
            label_singular: Bild
            widget: list
            field: { name: bild, label: Bild, widget: image }
          - { name: body, label: Text, widget: markdown }
      - name: mehr-ueber-mich
        label: More about me (farbig)
        file: src/content/seiten/mehr-ueber-mich.md
        media_folder: '../../assets/seiten'
        public_folder: '../../assets/seiten'
        fields:
          - name: bilder
            label: Bilder
            label_singular: Bild
            widget: list
            field: { name: bild, label: Bild, widget: image }
          - { name: body, label: Text, widget: markdown }
